# EML Shipping Tracker - Nginx: web app (static) + backend API (reverse proxy)
# Web app files:   /var/www/eml   (built by setup-vps.sh)
# Backend API:     127.0.0.1:5050  (docker-compose.prod.yml)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow photos/documents uploads (base64 payloads can be large)
    client_max_body_size 12m;

    root /var/www/eml;
    index index.html;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static web app (React SPA - fallback to index.html for client routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets - safe to cache forever
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
