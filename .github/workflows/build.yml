name: Build Releases

on:
  workflow_dispatch:        # Manual trigger
  push:
    tags:
      - "v*"                # Auto-build on version tags (v1.0.0, etc.)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos
            path: dist/*.dmg
          - os: windows-latest
            artifact_name: windows
            path: dist/*.exe
          - os: ubuntu-latest
            artifact_name: linux
            path: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install packaging deps
        working-directory: .
        run: npm ci

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eml-shipping-tracker-${{ matrix.artifact_name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EML Shipping Tracker ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/eml-shipping-tracker-macos/**/*.dmg
            artifacts/eml-shipping-tracker-windows/**/*.exe
            artifacts/eml-shipping-tracker-linux/**/*.AppImage
